        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateAdminCaseStudy
      tags: [admin-content]
      summary: Replace the editable fields (includes is_published, is_featured, is_sample)
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-063, REQ-067]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseStudyInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCaseStudy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteAdminCaseStudy
      tags: [admin-content]
      summary: Delete the case study with its results and gallery entries
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-063]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
