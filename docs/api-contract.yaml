openapi: 3.1.0
info:
  title: mitali-portfolio API
  version: 0.1.0
  description: |
    Contract-first: the FastAPI backend and the React frontend (pre-renderer, public pages, admin) build against this file.
    Design: docs/tech-spec.md (TS-003 errors and pagination, TS-004 public API, TS-007 enquiries, TS-008 auth,
    TS-010 admin CRUD, TS-011 media, TS-012 markdown, TS-013 profile/settings, TS-014 enquiries, TS-015 dashboard).
    Every operation carries x-status (status-tracker format) and x-implements (REQ IDs).
    Errors always use the envelope { "error": { "code", "message", "fields"? } }.
    All request bodies reject unknown fields on the server (Pydantic extra="forbid"); *Input schemas are not marked
    additionalProperties: false only because they are reused in allOf response schemas.
    Admin operations need the mp_session cookie; every admin POST/PUT/PATCH/DELETE except login also needs the
    X-CSRF-Token header (value from the login or me response, equal to the mp_csrf cookie).
servers:
  - url: http://localhost:8000
    description: Local backend (dev; the Vite dev server proxies /api from http://localhost:5173)
security: []
tags:
  - name: public
    description: Read-only published content (used by the pre-renderer) and the contact form
  - name: admin-auth
  - name: admin-dashboard
  - name: admin-content
  - name: admin-media
  - name: admin-site
    description: Profile and site settings
  - name: admin-enquiries

paths:
  # ------------------------------------------------------------------ health
  /api/health:
    get:
      operationId: getHealth
      tags: [public]
      summary: Liveness and database check
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-NFR-006]
      responses:
        "200":
          description: Service and database reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ------------------------------------------------------------------ public
  /api/public/site:
    get:
      operationId: getPublicSite
      tags: [public]
      summary: Site bundle (public settings + profile + server time used as the build snapshot)
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-002, REQ-004, REQ-014, REQ-040, REQ-050, REQ-052]
      responses:
        "200":
          description: Site bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteBundle" }

  /api/public/case-studies:
    get:
      operationId: listPublicCaseStudies
      tags: [public]
      summary: Published case studies in display order
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-011, REQ-020, REQ-022, REQ-051]
      parameters:
        - name: featured
          in: query
          required: false
          description: When true, only featured case studies
          schema: { type: boolean }
      responses:
        "200":
          description: Case-study summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseStudySummary" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/public/case-studies/{slug}:
    get:
      operationId: getPublicCaseStudy
      tags: [public]
      summary: Published case study with results, gallery and two "more work" items
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-021, REQ-022, REQ-023, REQ-050]
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Case-study detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseStudyDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/writing-samples:
    get:
      operationId: listPublicWritingSamples
      tags: [public]
      summary: Published writing samples in display order, optionally filtered by format
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-022, REQ-030, REQ-051]
      parameters:
        - name: format
          in: query
          required: false
          schema: { $ref: "#/components/schemas/WritingFormat" }
      responses:
        "200":
          description: Writing-sample summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WritingSampleSummary" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/public/writing-samples/{slug}:
    get:
      operationId: getPublicWritingSample
      tags: [public]
      summary: Published writing sample with sanitized body HTML
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-022, REQ-023, REQ-031, REQ-050]
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Writing-sample detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WritingSampleDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/services:
    get:
      operationId: listPublicServices
      tags: [public]
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-012]
      responses:
        "200":
          description: Published services in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }

  /api/public/engagement-models:
    get:
      operationId: listPublicEngagementModels
      tags: [public]
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-013]
      responses:
        "200":
          description: Published engagement models in display order
          content:
