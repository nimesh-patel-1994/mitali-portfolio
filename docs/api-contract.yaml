components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mp_session
      description: HttpOnly, SameSite=Strict session cookie set by adminLogin (8 h idle, 7 d absolute expiry).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on admin POST/PUT/PATCH/DELETE (except login); must equal the mp_csrf cookie and the session's token.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      description: Id of the nested result or gallery image
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Slug" }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    NoContent:
      description: Done, no body
    Unauthenticated:
      description: "No valid session (code unauthenticated)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CsrfFailed:
      description: "Missing or wrong X-CSRF-Token (code csrf_failed) or disallowed Origin (code origin_rejected)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "Unknown, unpublished (public) or mismatched resource (code not_found)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "Conflicting state (codes slug_taken with fields.slug, category_not_empty, media_in_use)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: "Invalid input (codes validation_error, order_mismatch, invalid_image); fields maps paths to messages"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "Body or file too large (codes payload_too_large, file_too_large)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: "File is not a JPEG, PNG, WebP or SVG image (code unsupported_media_type)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "Too many submissions from this client (code rate_limited)"
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyAttempts:
      description: "Login blocked for 15 minutes after 5 failures (code too_many_attempts)"
      headers:
        Retry-After:
          description: Seconds until the block ends
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------------------------------------------------------------- common
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_error, not_found, unauthenticated, invalid_credentials, csrf_failed, origin_rejected,
                     slug_taken, category_not_empty, media_in_use, order_mismatch, rate_limited, too_many_attempts,
                     file_too_large, unsupported_media_type, invalid_image, payload_too_large, service_unavailable,
                     internal_error]
            message: { type: string }
            fields:
              type: object
              description: Field path (e.g. "email", "results.0.value") to message
              additionalProperties: { type: string }
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok] }
    Slug:
      type: string
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 80
    StringList:
      type: array
      maxItems: 30
      items: { type: string, minLength: 1, maxLength: 60 }
    OrderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: Every id in the scope exactly once, in the new order (else 422 order_mismatch)
          minItems: 1
          items: { type: string, format: uuid }
    FaqOrderRequest:
      type: object
      required: [category_id, ids]
      properties:
        category_id: { type: string, format: uuid }
        ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    ImageSource:
      type: object
      required: [width, url]
      properties:
        width: { type: integer }
        url: { type: string, description: "Root-relative URL under /media/" }
    ImageRef:
      type: object
      required: [url, alt, width, height, mime, srcset]
      properties:
        url: { type: string, description: "Root-relative URL of the largest variant or the SVG" }
        alt: { type: string }
        width: { type: integer }
        height: { type: integer }
        mime: { type: string, enum: [image/webp, image/svg+xml] }
        srcset:
          type: array
          description: Responsive WebP variants (empty for SVG)
          items: { $ref: "#/components/schemas/ImageSource" }
    AdminMeta:
      type: object
      required: [id, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------------------------------------------------------------- public: site
    SocialLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        url: { type: string, format: uri, maxLength: 500 }
    PublicSettings:
      type: object
      required: [contact_email, booking_url, social_links, footer_signoff]
      properties:
        contact_email: { type: string, format: email }
        booking_url:
          type: [string, "null"]
          description: Absolute http(s) URL, "#" or null (null/"#" means link to /contact)
        social_links:
          type: array
          items: { $ref: "#/components/schemas/SocialLink" }
        footer_signoff: { type: string }
    VisionBlock:
      type: object
      required: [heading, body]
      properties:
        heading: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 600 }
    PublicProfile:
      type: object
      required: [name, headline, bio, skills, tools, years_experience, origin_statement, vision_blocks, portrait]
      properties:
        name: { type: string }
        headline: { type: string }
        bio:
          type: array
          description: Paragraphs
          items: { type: string }
        skills: { type: array, items: { type: string } }
        tools: { type: array, items: { type: string } }
        years_experience: { type: [integer, "null"] }
        origin_statement: { type: string }
        vision_blocks:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/VisionBlock" }
        portrait:
          anyOf:
            - { $ref: "#/components/schemas/ImageRef" }
            - { type: "null" }
    SiteBundle:
      type: object
      required: [generated_at, settings, profile]
      properties:
        generated_at:
          type: string
          format: date-time
          description: Server time of this response; the pre-renderer records it as content_snapshot_at
        settings: { $ref: "#/components/schemas/PublicSettings" }
        profile: { $ref: "#/components/schemas/PublicProfile" }

    # ---------------------------------------------------------------- public: case studies
    CaseStudySummary:
      type: object
      required: [slug, title, client_name, campaign_type, summary, cover, is_featured, is_sample, updated_at]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        client_name: { type: string }
        campaign_type: { type: string }
        summary: { type: string }
        cover:
          anyOf:
            - { $ref: "#/components/schemas/ImageRef" }
            - { type: "null" }
        is_featured: { type: boolean }
        is_sample: { type: boolean }
        updated_at: { type: string, format: date-time }
    CaseStudyResult:
      type: object
      required: [id, metric_label, value, before_value, change_text, period, is_sample]
      properties:
        id: { type: string, format: uuid }
        metric_label: { type: string }
        value: { type: string }
        before_value: { type: [string, "null"] }
        change_text: { type: [string, "null"] }
        period: { type: [string, "null"] }
        is_sample: { type: boolean }
    CaseStudyImage:
      type: object
      required: [id, layout, image, caption]
      properties:
        id: { type: string, format: uuid }
        layout: { $ref: "#/components/schemas/ImageLayout" }
        image: { $ref: "#/components/schemas/ImageRef" }
        caption: { type: [string, "null"] }
    ImageLayout:
      type: string
      enum: [full, half]
    CaseStudyDetail:
      allOf:
        - $ref: "#/components/schemas/CaseStudySummary"
        - type: object
          required: [client_industry, year, timeline, channels, goals, problem_html, solution_html, results, images, more_work]
          properties:
            client_industry: { type: string }
            year: { type: integer }
            timeline: { type: string }
            channels: { type: array, items: { type: string } }
            goals: { type: array, items: { type: string } }
            problem_html: { type: string, description: Sanitized HTML (TS-012) }
            solution_html: { type: string, description: Sanitized HTML (TS-012) }
            results:
              type: array
              items: { $ref: "#/components/schemas/CaseStudyResult" }
            images:
              type: array
              items: { $ref: "#/components/schemas/CaseStudyImage" }
            more_work:
              type: array
              maxItems: 2
              description: Next published case studies by position (wrapping), excluding this one
              items: { $ref: "#/components/schemas/CaseStudySummary" }

    # ---------------------------------------------------------------- public: writing
    WritingFormat:
      type: string
      enum: [blog, web_copy, email, social, landing_page, newsletter]
    WritingSampleSummary:
      type: object
      required: [slug, title, format, excerpt, thumbnail, client_name, published_on, reading_time_min, is_featured, is_sample, updated_at]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        format: { $ref: "#/components/schemas/WritingFormat" }
        excerpt: { type: string }
        thumbnail:
          anyOf:
            - { $ref: "#/components/schemas/ImageRef" }
            - { type: "null" }
        client_name: { type: [string, "null"] }
        published_on: { type: string, format: date }
        reading_time_min: { type: integer, minimum: 1 }
        is_featured: { type: boolean }
        is_sample: { type: boolean }
        updated_at: { type: string, format: date-time }
    WritingSampleDetail:
      allOf:
        - $ref: "#/components/schemas/WritingSampleSummary"
        - type: object
          required: [industry, tags, body_html, word_count]
          properties:
            industry: { type: [string, "null"] }
            tags: { type: array, items: { type: string } }
            body_html: { type: string, description: Sanitized HTML (TS-012) }
            word_count: { type: integer, minimum: 0 }

    # ---------------------------------------------------------------- public: other content
    Service:
      type: object
      required: [id, name, description, deliverables]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        deliverables: { type: array, items: { type: string } }
    CtaTarget:
      type: string
      enum: [booking, contact]
    EngagementModel:
      type: object
      required: [id, name, description, features, cta_label, cta_target]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        features: { type: array, items: { type: string } }
        cta_label: { type: string }
        cta_target: { $ref: "#/components/schemas/CtaTarget" }
    Testimonial:
      type: object
      required: [id, quote, author_name, author_role, company, case_study_slug]
      properties:
        id: { type: string, format: uuid }
        quote: { type: string }
        author_name: { type: string }
        author_role: { type: string }
        company: { type: string }
        case_study_slug:
          type: [string, "null"]
          description: Set only when the linked case study is published
    Faq:
      type: object
      required: [id, question, answer]
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        answer: { type: string, description: Plain text; blank lines separate paragraphs }
    FaqGroup:
      type: object
      required: [id, name, faqs]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        faqs:
          type: array
          items: { $ref: "#/components/schemas/Faq" }
    CoreValue:
      type: object
      required: [id, title, body]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
    ProcessStep:
      type: object
      required: [id, title, body]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }

    # ---------------------------------------------------------------- enquiries
    EnquiryType:
      type: string
      enum: [content_strategy, copywriting, seo_content, brand_messaging, campaign_planning, other]
    BudgetRange:
      type: string
      description: Currency and labels to be confirmed (tech-spec open question 2)
      enum: [under_1000, 1000_3000, 3000_7500, 7500_15000, over_15000, not_sure]
    EnquiryStatus:
      type: string
      enum: [new, replied, archived]
    EnquiryCreate:
      type: object
      required: [name, email, enquiry_type, message]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        enquiry_type: { $ref: "#/components/schemas/EnquiryType" }
        budget_range:
          anyOf:
            - { $ref: "#/components/schemas/BudgetRange" }
            - { type: "null" }
        company: { type: [string, "null"], maxLength: 120 }
        message: { type: string, minLength: 1, maxLength: 5000 }
        website:
          type: [string, "null"]
          maxLength: 200
          description: Honeypot; must be empty. When filled the response is 201 but nothing is stored.
    EnquiryReceived:
      type: object
      required: [received]
      properties:
        received: { type: boolean, const: true }
    EnquirySummary:
      type: object
      required: [id, name, email, company, enquiry_type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, "null"] }
        enquiry_type: { $ref: "#/components/schemas/EnquiryType" }
        status: { $ref: "#/components/schemas/EnquiryStatus" }
        created_at: { type: string, format: date-time }
    Enquiry:
      allOf:
        - $ref: "#/components/schemas/EnquirySummary"
        - type: object
          required: [budget_range, message, status_changed_at, updated_at]
          properties:
            budget_range:
              anyOf:
                - { $ref: "#/components/schemas/BudgetRange" }
                - { type: "null" }
            message: { type: string }
            status_changed_at: { type: [string, "null"], format: date-time }
            updated_at: { type: string, format: date-time }
    EnquiryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EnquirySummary" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    EnquiryStatusUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/EnquiryStatus" }

    # ---------------------------------------------------------------- admin auth and dashboard
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    AdminSession:
      type: object
      required: [email, csrf_token, idle_expires_at, absolute_expires_at]
      properties:
        email: { type: string, format: email }
        csrf_token: { type: string, description: Send as X-CSRF-Token; keep in memory only }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
    ContentCount:
      type: object
      required: [total, published]
      properties:
        total: { type: integer, minimum: 0 }
        published: { type: integer, minimum: 0 }
    LastBuild:
      type: object
      required: [built_at, content_snapshot_at]
      properties:
        built_at: { type: string, format: date-time }
        content_snapshot_at: { type: string, format: date-time }
    Dashboard:
      type: object
      required: [new_enquiries, content_changed_at, last_build, needs_rebuild, rebuild_command, content_counts]
      properties:
        new_enquiries: { type: integer, minimum: 0 }
        content_changed_at: { type: string, format: date-time }
        last_build:
          anyOf:
            - { $ref: "#/components/schemas/LastBuild" }
            - { type: "null" }
        needs_rebuild:
          type: boolean
          description: True when there is no build or content_changed_at > last_build.content_snapshot_at
        rebuild_command: { type: string, examples: ["cd frontend; npm run build:site"] }
        content_counts:
          type: object
          description: Keys case_studies, writing_samples, services, engagement_models, testimonials, faq_categories, faqs, values, process_steps
          additionalProperties: { $ref: "#/components/schemas/ContentCount" }

    # ---------------------------------------------------------------- admin case studies
    CaseStudyInput:
      type: object
      required: [slug, title, client_name, client_industry, campaign_type, channels, goals, summary, problem_md,
                 solution_md, year, timeline, cover_media_id, cover_alt, is_featured, is_published, is_sample]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string, minLength: 1, maxLength: 120 }
        client_name: { type: string, minLength: 1, maxLength: 120 }
        client_industry: { type: string, minLength: 1, maxLength: 80 }
        campaign_type: { type: string, minLength: 1, maxLength: 60 }
        channels: { $ref: "#/components/schemas/StringList" }
        goals: { $ref: "#/components/schemas/StringList" }
        summary: { type: string, minLength: 1, maxLength: 600 }
        problem_md: { type: string, minLength: 1, maxLength: 20000 }
        solution_md: { type: string, minLength: 1, maxLength: 20000 }
        year: { type: integer, minimum: 2000, maximum: 2100 }
        timeline: { type: string, minLength: 1, maxLength: 40 }
        cover_media_id: { type: [string, "null"], format: uuid }
        cover_alt:
          type: [string, "null"]
          maxLength: 250
          description: Required (non-blank) when cover_media_id is set
        is_featured: { type: boolean }
        is_published: { type: boolean }
        is_sample: { type: boolean }
    AdminCaseStudyListItem:
      type: object
      required: [id, slug, title, campaign_type, cover, is_featured, is_published, is_sample, position, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        campaign_type: { type: string }
        cover:
          anyOf:
            - { $ref: "#/components/schemas/ImageRef" }
            - { type: "null" }
        is_featured: { type: boolean }
        is_published: { type: boolean }
        is_sample: { type: boolean }
        position: { type: integer }
        updated_at: { type: string, format: date-time }
    AdminCaseStudy:
      allOf:
        - $ref: "#/components/schemas/CaseStudyInput"
        - $ref: "#/components/schemas/AdminMeta"
        - type: object
          required: [problem_html, solution_html, cover, results, images]
          properties:
            problem_html: { type: string }
            solution_html: { type: string }
            cover:
              anyOf:
                - { $ref: "#/components/schemas/ImageRef" }
                - { type: "null" }
            results:
              type: array
              items: { $ref: "#/components/schemas/AdminCaseStudyResult" }
            images:
              type: array
              items: { $ref: "#/components/schemas/AdminCaseStudyImage" }
    CaseStudyResultInput:
      type: object
      required: [metric_label, value, before_value, change_text, period, is_sample]
      properties:
        metric_label: { type: string, minLength: 1, maxLength: 80 }
        value: { type: string, minLength: 1, maxLength: 30 }
        before_value: { type: [string, "null"], maxLength: 30 }
        change_text: { type: [string, "null"], maxLength: 30, description: "e.g. +120 % or +2.1 pts" }
        period: { type: [string, "null"], maxLength: 40 }
        is_sample: { type: boolean }
    AdminCaseStudyResult:
      allOf:
        - $ref: "#/components/schemas/CaseStudyResultInput"
        - $ref: "#/components/schemas/AdminMeta"
    CaseStudyImageInput:
      type: object
      required: [media_id, alt, caption, layout]
      properties:
        media_id: { type: string, format: uuid }
        alt: { type: string, minLength: 1, maxLength: 250, description: Non-blank alt text is mandatory }
        caption: { type: [string, "null"], maxLength: 200 }
        layout: { $ref: "#/components/schemas/ImageLayout" }
    AdminCaseStudyImage:
      allOf:
        - $ref: "#/components/schemas/CaseStudyImageInput"
        - $ref: "#/components/schemas/AdminMeta"
        - type: object
          required: [image]
          properties:
            image: { $ref: "#/components/schemas/ImageRef" }

    # ---------------------------------------------------------------- admin writing samples
    WritingSampleInput:
      type: object
      required: [slug, title, format, client_name, industry, excerpt, body_md, published_on, tags, thumbnail_media_id,
                 thumbnail_alt, is_featured, is_published, is_sample]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string, minLength: 1, maxLength: 120 }
        format: { $ref: "#/components/schemas/WritingFormat" }
        client_name: { type: [string, "null"], maxLength: 120 }
        industry: { type: [string, "null"], maxLength: 80 }
        excerpt: { type: string, minLength: 1, maxLength: 600 }
        body_md: { type: string, minLength: 1, maxLength: 100000 }
        published_on: { type: string, format: date }
        tags: { $ref: "#/components/schemas/StringList" }
        thumbnail_media_id: { type: [string, "null"], format: uuid }
        thumbnail_alt:
          type: [string, "null"]
          maxLength: 250
          description: Required (non-blank) when thumbnail_media_id is set
        is_featured: { type: boolean }
        is_published: { type: boolean }
        is_sample: { type: boolean }
    AdminWritingSampleListItem:
      type: object
      required: [id, slug, title, format, is_published, is_sample, position, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        format: { $ref: "#/components/schemas/WritingFormat" }
        is_published: { type: boolean }
        is_sample: { type: boolean }
        position: { type: integer }
        updated_at: { type: string, format: date-time }
    AdminWritingSample:
      allOf:
        - $ref: "#/components/schemas/WritingSampleInput"
        - $ref: "#/components/schemas/AdminMeta"
        - type: object
          required: [body_html, word_count, reading_time_min, thumbnail]
          properties:
            body_html: { type: string }
            word_count: { type: integer, minimum: 0 }
            reading_time_min: { type: integer, minimum: 1 }
            thumbnail:
              anyOf:
                - { $ref: "#/components/schemas/ImageRef" }
                - { type: "null" }

    # ---------------------------------------------------------------- admin simple content types
    ServiceInput:
      type: object
      required: [name, description, deliverables, is_published]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 600 }
        deliverables: { $ref: "#/components/schemas/StringList" }
        is_published: { type: boolean }
    AdminService:
      allOf:
        - $ref: "#/components/schemas/ServiceInput"
        - $ref: "#/components/schemas/AdminMeta"
    EngagementModelInput:
      type: object
      required: [name, description, features, cta_label, cta_target, is_published]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 600 }
        features: { $ref: "#/components/schemas/StringList" }
        cta_label: { type: string, minLength: 1, maxLength: 40 }
        cta_target: { $ref: "#/components/schemas/CtaTarget" }
        is_published: { type: boolean }
    AdminEngagementModel:
      allOf:
        - $ref: "#/components/schemas/EngagementModelInput"
        - $ref: "#/components/schemas/AdminMeta"
    TestimonialInput:
      type: object
      required: [quote, author_name, author_role, company, case_study_id, is_published]
      properties:
        quote: { type: string, minLength: 1, maxLength: 600 }
        author_name: { type: string, minLength: 1, maxLength: 80 }
        author_role: { type: string, minLength: 1, maxLength: 80 }
        company: { type: string, minLength: 1, maxLength: 120 }
        case_study_id: { type: [string, "null"], format: uuid }
        is_published: { type: boolean }
    AdminTestimonial:
      allOf:
        - $ref: "#/components/schemas/TestimonialInput"
        - $ref: "#/components/schemas/AdminMeta"
    FaqCategoryInput:
      type: object
      required: [name, is_published]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        is_published: { type: boolean }
    AdminFaqCategory:
      allOf:
        - $ref: "#/components/schemas/FaqCategoryInput"
        - $ref: "#/components/schemas/AdminMeta"
        - type: object
          required: [faq_count]
          properties:
            faq_count: { type: integer, minimum: 0 }
    FaqInput:
      type: object
      required: [category_id, question, answer, show_in_preview, is_published]
      properties:
        category_id: { type: string, format: uuid }
        question: { type: string, minLength: 1, maxLength: 200 }
        answer: { type: string, minLength: 1, maxLength: 2000 }
        show_in_preview: { type: boolean }
        is_published: { type: boolean }
    AdminFaq:
      allOf:
        - $ref: "#/components/schemas/FaqInput"
        - $ref: "#/components/schemas/AdminMeta"
    CoreValueInput:
      type: object
      required: [title, body, is_published]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 600 }
        is_published: { type: boolean }
    AdminCoreValue:
      allOf:
        - $ref: "#/components/schemas/CoreValueInput"
        - $ref: "#/components/schemas/AdminMeta"
    ProcessStepInput:
      type: object
      required: [title, body, is_published]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 600 }
        is_published: { type: boolean }
    AdminProcessStep:
      allOf:
        - $ref: "#/components/schemas/ProcessStepInput"
        - $ref: "#/components/schemas/AdminMeta"

    # ---------------------------------------------------------------- admin media and markdown
    MediaUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, WebP or SVG, at most 10 MB (type detected from content)
        alt: { type: [string, "null"], maxLength: 250, description: Default alt suggestion }
    MediaAsset:
      type: object
      required: [id, url, mime, width, height, bytes, variants, alt, original_filename, source, created_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        mime: { type: string, enum: [image/webp, image/svg+xml] }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer }
        variants:
          type: array
          items: { $ref: "#/components/schemas/ImageSource" }
        alt: { type: [string, "null"] }
        original_filename: { type: [string, "null"] }
        source: { type: string, enum: [upload, seed] }
        created_at: { type: string, format: date-time }
    MediaPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaAsset" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    MarkdownPreviewRequest:
      type: object
      required: [markdown]
      additionalProperties: false
      properties:
        markdown: { type: string, maxLength: 100000 }
    MarkdownPreview:
      type: object
      required: [html, word_count, reading_time_min]
      properties:
        html: { type: string, description: Sanitized HTML }
        word_count: { type: integer, minimum: 0 }
        reading_time_min: { type: integer, minimum: 1 }

    # ---------------------------------------------------------------- admin profile and settings
    ProfileInput:
      type: object
      required: [name, headline, bio, skills, tools, years_experience, origin_statement, vision_blocks, portrait_media_id, portrait_alt]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        headline: { type: string, minLength: 1, maxLength: 160 }
        bio:
          type: array
          minItems: 1
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 1200 }
        skills: { $ref: "#/components/schemas/StringList" }
        tools: { $ref: "#/components/schemas/StringList" }
        years_experience: { type: [integer, "null"], minimum: 0, maximum: 60 }
        origin_statement: { type: string, minLength: 1, maxLength: 600 }
        vision_blocks:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/VisionBlock" }
        portrait_media_id: { type: [string, "null"], format: uuid }
        portrait_alt:
          type: [string, "null"]
          maxLength: 250
          description: Required (non-blank) when portrait_media_id is set
    AdminProfile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [portrait, updated_at]
          properties:
            portrait:
              anyOf:
                - { $ref: "#/components/schemas/ImageRef" }
                - { type: "null" }
            updated_at: { type: string, format: date-time }
    SettingsInput:
      type: object
      required: [contact_email, booking_url, social_links, footer_signoff, notification_email]
      properties:
        contact_email: { type: string, format: email, maxLength: 254 }
        booking_url:
          type: [string, "null"]
          maxLength: 500
          description: Absolute http(s) URL, "#" or null
        social_links:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/SocialLink" }
        footer_signoff: { type: string, minLength: 1, maxLength: 120 }
        notification_email:
          type: [string, "null"]
          format: email
          maxLength: 254
          description: Stored only; no email is sent (out of scope)
    AdminSettings:
      allOf:
        - $ref: "#/components/schemas/SettingsInput"
        - type: object
          required: [content_changed_at, updated_at]
          properties:
            content_changed_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time }
