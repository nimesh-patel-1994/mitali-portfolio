  /api/public/values:
    get:
      operationId: listPublicValues
      tags: [public]
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-040]
      responses:
        "200":
          description: Published values in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CoreValue" }

  /api/public/process-steps:
    get:
      operationId: listPublicProcessSteps
      tags: [public]
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-040]
      responses:
        "200":
          description: Published process steps in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcessStep" }

  /api/public/enquiries:
    post:
      operationId: createEnquiry
      tags: [public]
      summary: Submit the contact form (honeypot + per-client rate limit, 5 per 10 minutes)
      description: |
        A filled honeypot field (`website`) returns the same 201 response but nothing is stored.
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-042, REQ-043, REQ-NFR-005]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryCreate" }
      responses:
        "201":
          description: Received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryReceived" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ------------------------------------------------------------------ admin auth
  /api/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Log in; sets mp_session (HttpOnly) and mp_csrf cookies
      description: Origin header must be an allowed origin. Throttled per account and per client (5 failures / 15 min).
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-060, REQ-061, REQ-NFR-005]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: "mp_session=<token>; HttpOnly; SameSite=Strict; Path=/ (Secure when configured) and mp_csrf=<token>; SameSite=Strict; Path=/"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401":
          description: "Wrong email or password (code invalid_credentials, generic message)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: End the session and clear cookies
      x-status: NEW 2026-10-29 16:06
      x-implements: [REQ-060]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfFailed" }

  /api/admin/auth/me:
    get:
