[project]
name = "mitali-portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for the mitali-portfolio site (public content API, contact form, admin API, media)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi==25.1.0",
    "asyncpg>=0.32.0",
    "defusedxml==0.7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "fastapi-cli>=0.0.32",
    "markdown-it-py==4.2.0",
    "nh3==0.3.7",
    "pillow==13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions/*.mako"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC", "PT", "C4"]
ignore = [
    "S101", # assert is fine in tests (scoped below), kept off globally only for tests via per-file
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "be_t(id): backend test scenario ID from docs/backend-scope.md section 5",
    "sec(id): security verification from docs/security.md (SEC-* new tests, SQ-4 default)",
    "db: needs the mitali_portfolio_test database (added automatically to tests using DB fixtures)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
